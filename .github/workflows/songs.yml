name: Songlisten aktualisieren

on:
  schedule:
    # GitHub lässt geplante Läufe bei neuen Repos manchmal ausfallen -> 3 Zeitpunkte am Tag
    - cron: '17 4 * * *'
    - cron: '41 11 * * *'
    - cron: '53 17 * * *'
  workflow_dispatch:
    inputs:
      nur_extras:
        description: 'Nur Stimmungen/Drops (ohne Songlisten)'
        default: 'nein'

permissions:
  contents: write
  actions: write

jobs:
  songs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pip install -q -U yt-dlp pillow ytmusicapi
      - name: Alle Songs der Rapper holen
        run: |
          if [ "${{ github.event.inputs.nur_extras }}" = "ja" ]; then exit 0; fi
          rm -rf app/src/main/assets/covers app/src/main/assets/albums
          python3 tools/songs.py
      - name: Stimmungen und Drops
        run: python3 tools/extras.py
      - name: YouTube-Music-Verlauf
        env:
          YTM_HEADERS: ${{ secrets.YTM_HEADERS }}
        run: python3 tools/ytm.py
      - name: Speichern und neu bauen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Domi TV Bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A app/src/main/assets/songs app/src/main/assets/albums app/src/main/assets/covers \
                     app/src/main/assets/moods.json app/src/main/assets/drops.json app/src/main/assets/releases.json app/src/main/assets/ytm.json tools/mood_cache.json
          if git diff --cached --quiet; then echo "keine Änderung"; exit 0; fi
          BUILD=1
          # ytm.json, drops.json und releases.json holt die App selbst aus dem Netz -> dafür kein neues Update bauen
          if git diff --cached --quiet -- app/src/main/assets/songs app/src/main/assets/albums app/src/main/assets/covers app/src/main/assets/moods.json; then BUILD=0; fi
          git commit -m "Songlisten aktualisiert"
          git pull --rebase origin main
          git push
          if [ "$BUILD" = 1 ]; then gh workflow run build.yml --ref main; fi
