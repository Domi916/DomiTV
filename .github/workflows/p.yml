name: lrcprobe
on:
  push:
    branches: [lrcprobe]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip install -q -U yt-dlp
          for u in "https://www.youtube.com/channel/UCaG2V4fBeGjBVuLQu7bCcGg/releases" "https://music.youtube.com/channel/UCaG2V4fBeGjBVuLQu7bCcGg" "https://www.youtube.com/@kencarson/releases"; do
            echo "== $u"; timeout 120 yt-dlp --flat-playlist --print "RES %(id)s|%(title)s|%(url)s" "$u" 2>&1 | head -15
          done
          echo "== search topic"; timeout 60 yt-dlp --flat-playlist --print "RES %(channel)s|%(channel_id)s|%(title)s" "ytsearch5:Ken Carson Topic" 2>&1 | head
