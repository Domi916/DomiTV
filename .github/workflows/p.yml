name: lrcprobe
on:
  push:
    branches: [lrcprobe]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          pip install -q -U yt-dlp
          mkdir -p app/src/main/assets/songs
          python3 tools/songs.py
          wc -l app/src/main/assets/songs/*.txt
          head -5 app/src/main/assets/songs/*.txt
