name: Community-Fotos sammeln

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pip install -q pillow
      - run: python3 tools/pins.py
      - run: |
          cd /tmp/kandidaten
          git init -q -b kandidaten
          git config user.name "Domi TV Bot"; git config user.email "bot@users.noreply.github.com"
          git add -A; git commit -qm "Kandidaten"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" kandidaten
