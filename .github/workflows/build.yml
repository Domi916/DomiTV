name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: APK bauen
        run: gradle assembleDebug --no-daemon

      - name: Als Download veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DomiTV.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest DomiTV.apk --title "Domi TV" --notes "Automatisch gebaut aus ${GITHUB_SHA::7}"
