name: upscale
on:
  push:
    branches: [upscale]
permissions:
  contents: write
jobs:
  up:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q pillow numpy
          curl -sL -o RealESRGAN_x4plus.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.1.0/RealESRGAN_x4plus.pth
          python up.py
          git config user.name bot; git config user.email bot@x
          git add out && git commit -m "hochskaliert [skip ci]" && git push
