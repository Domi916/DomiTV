name: Bildschirmschoner-Fotos

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  saver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pip install -q -U yt-dlp pillow numpy
      - run: python3 tools/saver.py
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Domi TV Bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A app/src/main/assets/saver
          git commit -m "Bildschirmschoner: Fotos deiner Rapper" || exit 0
          git pull --rebase origin main
          git push
          gh workflow run build.yml --ref main
