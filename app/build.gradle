plugins {
    id 'com.android.application'
}

android {
    namespace 'at.domi.tvlauncher'
    compileSdk 34

    defaultConfig {
        applicationId 'at.domi.tvlauncher'
        minSdk 25
        targetSdk 30
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    androidResources {
        noCompress 'ogg'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
