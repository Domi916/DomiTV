<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Domi TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030305}
*{box-sizing:border-box}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;background:#030305;color:#f5f5f7;font-family:'Inter','Amazon Ember',Roboto,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute;left:0;top:0;width:1920px;height:1080px}

/* ---------- Hintergrund-Szenen ---------- */
.scene{opacity:0;visibility:hidden;transition:opacity .9s ease,visibility 0s linear .9s}
.scene.on{opacity:1;visibility:visible;transition:opacity .9s ease,visibility 0s}
.scene:not(.on) *{animation-play-state:paused!important}
.orb{position:absolute;border-radius:50%;animation:driftA 24s ease-in-out infinite alternate}
@keyframes driftA{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-120px,60px) scale(1.08)}100%{transform:translate(40px,-40px) scale(.96)}}
@keyframes sway{0%{transform:rotate(-2.5deg) scaleX(.85)}100%{transform:rotate(2.5deg) scaleX(1.3)}}
@keyframes waveMove{0%{transform:translateX(0)}100%{transform:translateX(-960px)}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes ring{0%{transform:scale(.12);opacity:0}12%{opacity:.85}100%{transform:scale(1);opacity:0}}
@keyframes core{0%,100%{transform:scale(1);opacity:.75}50%{transform:scale(1.12);opacity:1}}
@keyframes shimmer{0%{transform:translateX(-140%)}100%{transform:translateX(240%)}}
.breathe{animation:breathe 6s ease-in-out infinite}

#beam{position:absolute;top:0;width:720px;height:1080px;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.06) 55%,rgba(255,255,255,.12) 82%,rgba(255,255,255,0) 100%);-webkit-clip-path:polygon(44% 0,56% 0,100% 100%,0 100%);clip-path:polygon(44% 0,56% 0,100% 100%,0 100%);filter:blur(18px);transition:left .5s cubic-bezier(.2,.8,.2,1),opacity .4s ease}
.shade1{background:radial-gradient(ellipse 1500px 1000px at 60% 35%,rgba(3,3,5,0) 35%,rgba(3,3,5,.72) 100%)}
.shade2{background:linear-gradient(90deg,rgba(3,3,5,.6) 0%,rgba(3,3,5,0) 45%)}
.shade3{background:linear-gradient(180deg,rgba(3,3,5,.4) 0%,rgba(3,3,5,0) 20%,rgba(3,3,5,0) 50%,rgba(3,3,5,.92) 100%);transition:opacity .6s ease}
#grain{opacity:.1;mix-blend-mode:overlay;pointer-events:none}

/* ---------- Glas ---------- */
.glass{background:rgba(18,18,22,.42);border:1px solid rgba(255,255,255,.13);-webkit-backdrop-filter:blur(34px) saturate(125%);backdrop-filter:blur(34px) saturate(125%);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 20px 50px rgba(0,0,0,.35)}

/* ---------- Kopfzeile ---------- */
header{position:absolute;left:96px;right:96px;top:60px;display:flex;align-items:center;justify-content:space-between}
.who{display:flex;align-items:center;gap:18px}
.avatar{width:58px;height:58px;border-radius:50%;background:linear-gradient(145deg,#f2f2f7,#636366);border:1px solid rgba(255,255,255,.35);box-shadow:0 10px 30px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:800;color:#1c1c1e}
.greet{font-size:28px;font-weight:650;letter-spacing:-.02em}
.date{font-size:20px;font-weight:500;color:rgba(245,245,247,.6);margin-top:2px}
.pill{display:flex;align-items:center;gap:12px;height:74px;padding:0 11px 0 32px;border-radius:999px}
.time{font-size:31px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-right:14px}
.iconbtn{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;transition:transform .3s cubic-bezier(.2,.8,.2,1),background .25s ease}
.iconbtn svg{stroke:rgba(245,245,247,.92);transition:stroke .25s ease}
.iconbtn.on{background:#f5f5f7;transform:scale(1.18)}
.iconbtn.on svg{stroke:#0a0a0c}

/* ---------- Hero + Dock ---------- */
#lift{position:absolute;left:96px;right:96px;bottom:110px;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
#heroes{position:relative;height:262px;transition:opacity .45s ease,filter .5s ease}
.hero{position:absolute;left:0;bottom:0;display:flex;flex-direction:column;gap:14px;opacity:0;transform:translateX(40px);filter:blur(14px);transition:opacity .55s ease,transform .65s cubic-bezier(.2,.8,.2,1),filter .55s ease}
.hero.before{transform:translateX(-40px)}
.hero.on{opacity:1;transform:none;filter:none}
.meta{display:flex;align-items:center;gap:18px}
.idx{font-size:22px;font-weight:700;letter-spacing:.04em;color:rgba(245,245,247,.92);font-variant-numeric:tabular-nums}
.line{width:48px;height:2px;border-radius:1px}
.kind{font-size:22px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:rgba(245,245,247,.64)}
.titlewrap{position:relative;align-self:flex-start;overflow:hidden;padding-bottom:12px}
.title{margin:0;font-size:200px;line-height:.92;font-weight:900;letter-spacing:-.065em;white-space:nowrap;background:linear-gradient(180deg,#fff 0%,#fff 45%,rgba(255,255,255,.5) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.shimmer{position:absolute;left:0;top:0;width:40%;height:100%;background:linear-gradient(100deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.14) 50%,rgba(255,255,255,0) 100%);mix-blend-mode:overlay;animation:shimmer 3.6s cubic-bezier(.4,0,.2,1) .4s infinite}

#dock{position:relative;display:inline-flex;gap:32px;padding:28px;margin-top:64px;border-radius:54px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);-webkit-backdrop-filter:blur(40px) saturate(170%);backdrop-filter:blur(40px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 40px 100px rgba(0,0,0,.45)}
.slot{position:relative;width:280px;height:158px;flex:none}
.tile{position:absolute;left:0;top:0;width:280px;height:158px;border-radius:30px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:linear-gradient(155deg,var(--t1),var(--t2));opacity:.62;-webkit-filter:saturate(.7);filter:saturate(.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 14px 34px rgba(0,0,0,.45);transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .35s ease,box-shadow .4s ease,filter .35s ease}
.tile::before{content:'';position:absolute;left:0;top:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(255,255,255,.18) 0%,rgba(255,255,255,0) 50%)}
.tile::after{content:'';position:absolute;left:0;top:0;right:0;bottom:0;background:linear-gradient(115deg,rgba(255,255,255,0) 28%,rgba(255,255,255,.24) 46%,rgba(255,255,255,0) 64%);opacity:0;transition:opacity .3s ease}
.tile span{position:relative;font-size:32px;font-weight:750;letter-spacing:-.035em;white-space:nowrap}
.tile.on{transform:translateY(-14px) scale(1.12);opacity:1;-webkit-filter:none;filter:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.32),0 0 0 1px rgba(255,255,255,.22),0 46px 90px rgba(0,0,0,.6),0 0 150px var(--glowA)}
.tile.on::after{opacity:1}
.tile.missing{opacity:.25}
.reflect{position:absolute;left:0;top:166px;width:280px;height:158px;border-radius:30px;background:linear-gradient(155deg,var(--t1),var(--t2));transform:scaleY(-1);-webkit-mask-image:linear-gradient(0deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 45%);mask-image:linear-gradient(0deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 45%);opacity:.35;transition:opacity .35s ease}
.slot.on .reflect{opacity:.9}
.bar{position:absolute;left:50%;bottom:-18px;height:4px;width:0;border-radius:2px;background:#fff;transform:translateX(-50%);opacity:0;transition:width .35s cubic-bezier(.2,.8,.2,1),opacity .35s ease}
.slot.on .bar{width:64px;opacity:1}

/* ---------- Weiter ansehen ---------- */
body.cont #lift{transform:translateY(-400px)}
body.cont #heroes{opacity:0;filter:blur(16px)}
#cont{position:absolute;left:96px;right:96px;top:650px;opacity:0;transform:translateY(260px);transition:opacity .55s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
body.cont #cont{opacity:1;transform:none;transition-delay:.12s,0s}
.conthead{display:flex;align-items:baseline;gap:18px}
.conthead b{font-size:34px;font-weight:700;letter-spacing:-.025em}
.conthead span{font-size:22px;font-weight:500;color:rgba(245,245,247,.55)}
#cards{display:flex;gap:36px;margin-top:26px;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.card{position:relative;flex:none;width:400px;height:225px;border-radius:30px;overflow:hidden;opacity:.62;-webkit-filter:saturate(.75);filter:saturate(.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 14px 34px rgba(0,0,0,.45);transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .35s ease,box-shadow .4s ease,filter .35s ease}
.card.on{transform:translateY(-10px) scale(1.08);opacity:1;-webkit-filter:none;filter:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 0 1px rgba(255,255,255,.24),0 44px 90px rgba(0,0,0,.6),0 0 130px var(--glowA)}
.card .art{position:absolute;left:0;top:0;right:0;bottom:0}
.card .gloss{position:absolute;left:0;top:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,0) 40%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%)}
.card .tag{position:absolute;left:22px;top:20px;height:34px;padding:0 14px;line-height:34px;border-radius:17px;background:rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.18);font-size:16px;font-weight:650;color:rgba(255,255,255,.92)}
.card .play{position:absolute;right:22px;top:20px;width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35);opacity:0;transform:scale(.7);transition:opacity .3s ease,transform .35s cubic-bezier(.2,.8,.2,1)}
.card.on .play{opacity:1;transform:none}
.card .txt{position:absolute;left:24px;right:24px;bottom:24px}
.card .ct{font-size:30px;font-weight:750;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .cs{display:flex;justify-content:space-between;margin-top:6px;font-size:18px;font-weight:500;color:rgba(255,255,255,.78)}
#chev{position:absolute;left:50%;bottom:26px;margin-left:-15px;opacity:.4;transition:opacity .4s ease,transform .5s cubic-bezier(.2,.8,.2,1)}
body.cont #chev{transform:rotate(180deg);opacity:.55}
body.nocont #chev{display:none}

/* ---------- Meldung ---------- */
#toast{position:absolute;left:50%;top:170px;transform:translate(-50%,-20px);height:64px;padding:0 30px;border-radius:32px;display:flex;align-items:center;font-size:24px;font-weight:600;opacity:0;transition:opacity .3s ease,transform .4s cubic-bezier(.2,.8,.2,1);pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Startanimation ---------- */
#intro{display:none;background:#030305}
#intro.play{display:block;animation:introOut 2.8s ease .2s both}
#intro.play .iglow{animation:iglow 2.8s cubic-bezier(.2,.8,.2,1) .2s both}
#intro.play .isweep{animation:isweep 2.8s cubic-bezier(.2,.8,.2,1) .2s both}
#intro.play .iring{animation:iringOut 2.8s cubic-bezier(.6,0,.4,1) .2s both}
#intro.play .iring circle.draw{animation:iringDraw 2.8s cubic-bezier(.65,0,.35,1) .2s both}
#intro.play .igreet{animation:igreet 2.8s cubic-bezier(.2,.8,.2,1) .2s both}
#intro.play .isub{animation:isub 2.8s cubic-bezier(.2,.8,.2,1) .2s both}
.iglow{position:absolute;left:610px;top:190px;width:700px;height:700px;border-radius:50%;background:conic-gradient(from 0deg,#e01b2a,#ff3a78,#5a7aff,#1aa6dc,#e8e8f0,#e01b2a);filter:blur(90px)}
.isweep{position:absolute;left:50%;top:539px;height:2px;transform:translateX(-50%);background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.9) 50%,rgba(255,255,255,0));box-shadow:0 0 24px rgba(255,255,255,.6)}
.iring{position:absolute;left:790px;top:370px;width:340px;height:340px}
.itext{position:absolute;left:0;top:0;width:1920px;height:1080px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.igreet{font-size:96px;font-weight:800;white-space:nowrap;background:linear-gradient(180deg,#fff 0%,rgba(255,255,255,.6) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.isub{font-size:28px;font-weight:500;letter-spacing:.02em;color:rgba(245,245,247,.62)}
@keyframes introOut{0%{opacity:1}86%{opacity:1}100%{opacity:0}}
@keyframes iringDraw{0%{stroke-dashoffset:943}4%{stroke-dashoffset:943}38%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
@keyframes iringOut{0%{transform:scale(1) rotate(0);opacity:1}72%{transform:scale(1) rotate(90deg);opacity:1}96%{transform:scale(5.5) rotate(120deg);opacity:0}100%{transform:scale(5.5) rotate(120deg);opacity:0}}
@keyframes iglow{0%{opacity:0;transform:scale(.4) rotate(0)}15%{opacity:0;transform:scale(.4) rotate(0)}45%{opacity:1;transform:scale(1) rotate(120deg)}72%{opacity:1;transform:scale(1.06) rotate(200deg)}96%{opacity:0;transform:scale(3.2) rotate(260deg)}100%{opacity:0;transform:scale(3.2) rotate(260deg)}}
@keyframes isweep{0%{width:0;opacity:0}18%{width:0;opacity:0}22%{opacity:1}42%{width:1500px;opacity:1}62%{width:1500px;opacity:0}100%{width:1500px;opacity:0}}
@keyframes igreet{0%{opacity:0;letter-spacing:.5em;filter:blur(14px);transform:translateY(0)}34%{opacity:0;letter-spacing:.5em;filter:blur(14px);transform:translateY(0)}58%{opacity:1;letter-spacing:-.03em;filter:blur(0);transform:translateY(0)}74%{opacity:1;letter-spacing:-.03em;filter:blur(0);transform:translateY(0)}92%{opacity:0;letter-spacing:-.03em;filter:blur(8px);transform:translateY(-36px)}100%{opacity:0;transform:translateY(-36px)}}
@keyframes isub{0%{opacity:0;transform:translateY(12px)}46%{opacity:0;transform:translateY(12px)}64%{opacity:1;transform:none}74%{opacity:1;transform:none}92%{opacity:0;transform:translateY(-24px)}100%{opacity:0;transform:translateY(-24px)}}

/* ---------- Lite-Modus für schwache Geräte (Fire TV Stick) ---------- */
body.lite .glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(24,24,28,.82)}
body.lite #dock{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(20,20,24,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
body.lite #grain,body.lite .shimmer,body.lite #beam,body.lite .reflect{display:none}
body.lite .orb{animation:none}
body.lite .tile{-webkit-filter:none;filter:none;box-shadow:none;transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .25s ease;will-change:transform}
body.lite .tile.on{box-shadow:0 0 0 3px rgba(255,255,255,.92)}
body.lite .tile::after{transition:none}
body.lite .card{-webkit-filter:none;filter:none;box-shadow:none;transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .25s ease;will-change:transform}
body.lite .card.on{box-shadow:0 0 0 3px rgba(255,255,255,.92)}
body.lite .hero,body.lite .hero.on{-webkit-filter:none!important;filter:none!important;transition:opacity .35s ease,transform .45s cubic-bezier(.2,.8,.2,1)}
body.lite #heroes{-webkit-filter:none!important;filter:none!important}
body.lite .scene{will-change:opacity;transition:opacity .45s ease,visibility 0s linear .45s}
body.lite .scene.on{transition:opacity .45s ease,visibility 0s}
body.lite .scene *{animation:none!important;will-change:auto!important}
body.lite .shade2,body.lite .shade3{display:none}
body.lite .shade1{background:radial-gradient(ellipse 1500px 1000px at 60% 35%,rgba(3,3,5,0) 35%,rgba(3,3,5,.72) 100%),linear-gradient(90deg,rgba(3,3,5,.6) 0%,rgba(3,3,5,0) 45%),linear-gradient(180deg,rgba(3,3,5,.4) 0%,rgba(3,3,5,0) 20%,rgba(3,3,5,0) 50%,rgba(3,3,5,.92) 100%)}
.card.hint .art{background:linear-gradient(155deg,#2a2a30 0%,#121215 80%)}
body.lite .iglow{-webkit-filter:none;filter:none;background:radial-gradient(circle at 35% 42%,rgba(224,27,42,.75) 0%,rgba(224,27,42,0) 50%),radial-gradient(circle at 66% 40%,rgba(90,122,255,.75) 0%,rgba(90,122,255,0) 50%),radial-gradient(circle at 50% 68%,rgba(26,166,220,.65) 0%,rgba(26,166,220,0) 50%),radial-gradient(circle at 50% 30%,rgba(255,58,120,.5) 0%,rgba(255,58,120,0) 45%)}
body.lite #intro.play .igreet{animation-name:igreetLite}
body.lite .isweep{box-shadow:none}
@keyframes igreetLite{0%{opacity:0;transform:scale(1.15)}34%{opacity:0;transform:scale(1.15)}58%{opacity:1;transform:none}74%{opacity:1;transform:none}92%{opacity:0;transform:translateY(-36px)}100%{opacity:0;transform:translateY(-36px)}}
</style>
</head>
<body>
<div id="stage">
  <div id="scenes"></div>
  <div id="beam"></div>
  <svg id="grain" class="abs" width="1920" height="1080" aria-hidden="true"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/></filter><rect width="1920" height="1080" filter="url(#g)"/></svg>
  <div class="abs shade1"></div>
  <div class="abs shade2"></div>
  <div class="abs shade3"></div>

  <header>
    <div class="who">
      <div class="avatar" id="avatar">D</div>
      <div><div class="greet" id="greet"></div><div class="date" id="date"></div></div>
    </div>
    <div class="pill glass">
      <div class="time" id="time"></div>
      <div class="iconbtn" id="btnHome" aria-label="Fire-TV-Startseite">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5L12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/></svg>
      </div>
      <div class="iconbtn" id="btnSettings" aria-label="Einstellungen">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
      </div>
    </div>
  </header>

  <div id="lift">
    <div id="heroes"></div>
    <div id="dock"></div>
  </div>

  <section id="cont">
    <div class="conthead"><b>Weiter ansehen</b><span id="contSub"></span></div>
    <div id="cards"></div>
  </section>

  <svg id="chev" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="rgba(245,245,247,.85)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>

  <div id="toast" class="glass"></div>

  <div id="intro" class="abs">
    <div class="iglow"></div>
    <div class="isweep"></div>
    <div class="iring">
      <svg width="340" height="340" viewBox="0 0 340 340" fill="none" style="transform:rotate(-90deg)">
        <defs><linearGradient id="rg" x1="0" y1="0" x2="340" y2="340" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#e01b2a"/><stop offset=".25" stop-color="#ff3a78"/><stop offset=".5" stop-color="#5a7aff"/><stop offset=".75" stop-color="#1aa6dc"/><stop offset="1" stop-color="#e8e8f0"/></linearGradient></defs>
        <circle cx="170" cy="170" r="150" stroke="rgba(255,255,255,.06)" stroke-width="2"/>
        <circle class="draw" cx="170" cy="170" r="150" stroke="url(#rg)" stroke-width="3" stroke-linecap="round" stroke-dasharray="943" stroke-dashoffset="943"/>
      </svg>
    </div>
    <div class="itext"><div class="igreet" id="igreet"></div><div class="isub" id="isub"></div></div>
  </div>
</div>

<script src="config.js"></script>
<script>
(function () {
  'use strict';
  var C = window.CONFIG || {};
  var APPS = C.apps || [];
  var A = window.Android || null;
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  var S = { sel: store.get('sel', 0), zone: 'apps', cSel: 0, tSel: 0 };
  if (S.sel >= APPS.length) S.sel = 0;
  var pkgs = {};
  var cards = [];

  // ---------- Skalierung auf den Bildschirm ----------
  function fit() {
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    var st = $('stage');
    st.style.transform = 'scale(' + s + ')';
    st.style.left = Math.round((window.innerWidth - 1920 * s) / 2) + 'px';
    st.style.top = Math.round((window.innerHeight - 1080 * s) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  fit();

  // ---------- Szenen ----------
  var seed = 7;
  function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
  function wave(base, amp, period, phase) {
    var p = '';
    for (var x = 0; x <= 2880; x += 24) {
      var y = base + amp * Math.sin(x / period * Math.PI * 2 + phase) + amp * 0.35 * Math.sin(x / (period / 2) * Math.PI * 2 + phase * 1.7);
      p += (x === 0 ? 'M' : 'L') + x + ' ' + y.toFixed(1) + ' ';
    }
    return p;
  }
  function orb(l, t, size, color, op) {
    return '<div class="orb" style="left:' + l + 'px;top:' + t + 'px;width:' + size + 'px;height:' + size + 'px;background:radial-gradient(circle,' + color + ' 0%,rgba(3,3,5,0) 60%);opacity:' + op + '"></div>';
  }
  var LITE = false;
  function soft(l, t, w, h, color) {
    return '<div style="position:absolute;left:' + l + 'px;top:' + t + 'px;width:' + w + 'px;height:' + h + 'px;background:radial-gradient(ellipse at 50% 50%,' + color + ' 0%,rgba(0,0,0,0) 70%)"></div>';
  }
  var ART_LITE = {
    netflix: function () {
      var h = orb(860, -560, 1600, '#9a0d18', 0.8);
      for (var i = 0; i < 5; i++) {
        var x = 1020 + i * 180 + rnd() * 40, w = 90 + rnd() * 120;
        h += '<div style="position:absolute;left:' + Math.round(x) + 'px;top:-160px;width:' + Math.round(w) + 'px;height:' + Math.round(900 + rnd() * 240) + 'px;background:radial-gradient(ellipse 50% 50% at 50% 42%,rgba(255,40,52,' + (0.45 + rnd() * 0.35).toFixed(2) + ') 0%,rgba(255,40,52,0) 100%);transform-origin:50% 0;will-change:transform;animation:sway ' + (7 + rnd() * 5).toFixed(1) + 's ease-in-out -' + (rnd() * 8).toFixed(1) + 's infinite alternate"></div>';
      }
      return h;
    },
    youtube: function () {
      var w = [[340, 70, 960, 0, 0.45, 2, 40], [420, 95, 960, 1.6, 0.28, 1.5, 56], [500, 80, 960, 3.3, 0.35, 2, 48]];
      var g = '';
      w.forEach(function (v) { g += '<g style="will-change:transform;animation:waveMove ' + v[6] + 's linear infinite"><path d="' + wave(v[0], v[1], v[2], v[3]) + '" stroke="rgba(255,255,255,' + v[4] + ')" stroke-width="' + v[5] + '"/></g>'; });
      return orb(760, -600, 1700, '#5c5c6c', 0.75) + '<svg class="abs" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" style="-webkit-mask-image:linear-gradient(90deg,rgba(0,0,0,0) 30%,#000 70%,rgba(0,0,0,.6) 100%);mask-image:linear-gradient(90deg,rgba(0,0,0,0) 30%,#000 70%,rgba(0,0,0,.6) 100%)">' + g + '</svg>';
    },
    prime: function () {
      return orb(700, -700, 1700, '#0b4f78', 0.7) + soft(700, 380, 1400, 700, 'rgba(26,166,220,.45)') +
        '<div style="position:absolute;left:100px;top:660px;width:2600px;height:2600px;border-radius:50%;background:radial-gradient(circle at 50% 0%,#0a2a40 0%,#020810 18%,#020406 40%);box-shadow:0 -2px 0 rgba(180,235,255,.85),0 -10px 40px rgba(26,166,220,.9),0 -60px 180px rgba(26,166,220,.6)"></div>' +
        soft(1200, 560, 400, 200, 'rgba(220,245,255,.9)');
    },
    disney: function () {
      var h = orb(820, -560, 1600, '#1f2fa0', 0.8) + orb(260, -420, 1000, '#4a1a8a', 0.6) +
        '<div style="position:absolute;left:820px;top:120px;width:1500px;height:900px;border-radius:50%;border-top:3px solid rgba(200,215,255,.85);box-shadow:0 -8px 40px rgba(120,150,255,.5);-webkit-mask-image:linear-gradient(90deg,rgba(0,0,0,0) 0%,#000 30%,#000 75%,rgba(0,0,0,0) 100%);mask-image:linear-gradient(90deg,rgba(0,0,0,0) 0%,#000 30%,#000 75%,rgba(0,0,0,0) 100%)"></div>';
      for (var i = 0; i < 26; i++) {
        var s = 3 + rnd() * 3;
        h += '<div style="position:absolute;left:' + Math.round(820 + rnd() * 1080) + 'px;top:' + Math.round(20 + rnd() * 640) + 'px;width:' + Math.round(s * 3) + 'px;height:' + Math.round(s * 3) + 'px;border-radius:50%;background:radial-gradient(circle,#fff 0%,rgba(170,190,255,.6) 25%,rgba(170,190,255,0) 70%);will-change:opacity;animation:breathe ' + (2.5 + rnd() * 4).toFixed(1) + 's ease-in-out -' + (rnd() * 6).toFixed(1) + 's infinite"></div>';
      }
      return h;
    },
    ytmusic: function () {
      var h = orb(820, -500, 1500, '#8a1240', 0.8);
      for (var i = 0; i < 3; i++) {
        h += '<div style="position:absolute;left:910px;top:-90px;width:1100px;height:1100px;border-radius:50%;border:2px solid rgba(255,110,160,.6);will-change:transform,opacity;animation:ring 7.2s cubic-bezier(.2,.6,.4,1) -' + (i * 2.4).toFixed(1) + 's infinite"></div>';
      }
      return h + '<div style="position:absolute;left:1310px;top:210px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95) 0%,rgba(255,90,140,.7) 22%,rgba(255,58,120,0) 60%);will-change:transform;animation:core 1.6s ease-in-out infinite"></div>';
    }
  };
  var ART = {
    netflix: function () {
      var h = orb(860, -560, 1600, '#9a0d18', 0.8);
      for (var i = 0; i < 10; i++) {
        var x = 1000 + i * 92 + rnd() * 50, w = 30 + rnd() * 120, a = (0.35 + rnd() * 0.5).toFixed(2);
        h += '<div class="' + (i % 2 ? 'extra' : '') + '" style="position:absolute;left:' + Math.round(x) + 'px;top:-160px;width:' + Math.round(w) + 'px;height:' + Math.round(820 + rnd() * 320) + 'px;border-radius:' + Math.round(w) + 'px;background:linear-gradient(180deg,rgba(255,40,52,0) 0%,rgba(255,40,52,' + a + ') 42%,rgba(140,6,16,0) 100%);filter:blur(' + Math.round(8 + rnd() * 26) + 'px);transform-origin:50% 0;animation:sway ' + (6 + rnd() * 6).toFixed(1) + 's ease-in-out -' + (rnd() * 8).toFixed(1) + 's infinite alternate"></div>';
      }
      return h;
    },
    youtube: function () {
      var w = [[330, 70, 960, 0, 0.5, 2, 38], [380, 95, 960, 1.2, 0.32, 1.5, 52], [430, 55, 480, 2.1, 0.22, 1.5, 30], [470, 80, 960, 3.3, 0.4, 2.5, 64], [520, 110, 960, 4.4, 0.16, 1, 46], [560, 45, 480, 5.2, 0.26, 1.5, 34]];
      var g = '';
      w.forEach(function (v, i) { g += '<g class="' + (i > 3 ? 'extra' : '') + '" style="animation:waveMove ' + v[6] + 's linear infinite"><path d="' + wave(v[0], v[1], v[2], v[3]) + '" stroke="rgba(255,255,255,' + v[4] + ')" stroke-width="' + v[5] + '"/></g>'; });
      return orb(760, -600, 1700, '#5c5c6c', 0.75) + '<svg class="abs" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" style="-webkit-mask-image:linear-gradient(90deg,rgba(0,0,0,0) 30%,#000 70%,rgba(0,0,0,.6) 100%);mask-image:linear-gradient(90deg,rgba(0,0,0,0) 30%,#000 70%,rgba(0,0,0,.6) 100%)">' + g + '</svg>';
    },
    prime: function () {
      return orb(700, -700, 1700, '#0b4f78', 0.7) +
        '<div class="breathe" style="position:absolute;left:700px;top:380px;width:1400px;height:700px;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,rgba(26,166,220,.55) 0%,rgba(26,166,220,0) 60%);filter:blur(20px)"></div>' +
        '<div style="position:absolute;left:100px;top:660px;width:2600px;height:2600px;border-radius:50%;background:radial-gradient(circle at 50% 0%,#0a2a40 0%,#020810 18%,#020406 40%);box-shadow:0 -2px 0 rgba(180,235,255,.85),0 -10px 40px rgba(26,166,220,.9),0 -60px 180px rgba(26,166,220,.6)"></div>' +
        '<div class="breathe" style="position:absolute;left:1200px;top:560px;width:400px;height:200px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.95) 0%,rgba(160,225,255,.5) 25%,rgba(26,166,220,0) 70%);filter:blur(6px)"></div>';
    },
    disney: function () {
      var h = orb(820, -560, 1600, '#1f2fa0', 0.8) + orb(260, -420, 1000, '#4a1a8a', 0.6) +
        '<div class="breathe" style="position:absolute;left:820px;top:120px;width:1500px;height:900px;border-radius:50%;border-top:3px solid rgba(200,215,255,.85);box-shadow:0 -8px 40px rgba(120,150,255,.5);-webkit-mask-image:linear-gradient(90deg,rgba(0,0,0,0) 0%,#000 30%,#000 75%,rgba(0,0,0,0) 100%);mask-image:linear-gradient(90deg,rgba(0,0,0,0) 0%,#000 30%,#000 75%,rgba(0,0,0,0) 100%)"></div>';
      for (var i = 0; i < 64; i++) {
        var s = 1.5 + rnd() * 3.5;
        h += '<div class="' + (i % 2 ? 'extra' : '') + '" style="position:absolute;left:' + Math.round(820 + rnd() * 1080) + 'px;top:' + Math.round(20 + rnd() * 640) + 'px;width:' + s.toFixed(1) + 'px;height:' + s.toFixed(1) + 'px;border-radius:50%;background:#fff;box-shadow:0 0 ' + Math.round(s * 4) + 'px rgba(170,190,255,.95);animation:twinkle ' + (2 + rnd() * 4).toFixed(1) + 's ease-in-out -' + (rnd() * 6).toFixed(1) + 's infinite"></div>';
      }
      return h;
    },
    ytmusic: function () {
      var h = orb(820, -500, 1500, '#8a1240', 0.8);
      for (var i = 0; i < 6; i++) {
        h += '<div class="' + (i % 2 ? 'extra' : '') + '" style="position:absolute;left:910px;top:-90px;width:1100px;height:1100px;border-radius:50%;border:2px solid rgba(255,110,160,.7);box-shadow:0 0 30px rgba(255,58,120,.35),inset 0 0 30px rgba(255,58,120,.25);animation:ring 7.2s cubic-bezier(.2,.6,.4,1) -' + (i * 1.2).toFixed(1) + 's infinite"></div>';
      }
      return h + '<div style="position:absolute;left:1350px;top:250px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95) 0%,rgba(255,90,140,.7) 30%,rgba(255,58,120,0) 70%);filter:blur(4px);animation:core 1.6s ease-in-out infinite"></div>';
    }
  };

  // ---------- Aufbau ----------
  function build() {
    var sc = '', he = '', dk = '';
    APPS.forEach(function (a, i) {
      var set = LITE ? ART_LITE : ART;
      var art = set[a.id] ? set[a.id]() : orb(820, -560, 1600, a.glow, 0.7);
      sc += '<div class="abs scene" data-i="' + i + '">' + art + '</div>';
      he += '<div class="hero" data-i="' + i + '"><div class="meta"><div class="idx">' + (i < 9 ? '0' : '') + (i + 1) + ' / ' + (APPS.length < 10 ? '0' : '') + APPS.length + '</div><div class="line" style="background:' + a.glow + ';box-shadow:0 0 14px ' + a.glow + '"></div><div class="kind">' + esc(a.art) + '</div></div>' +
        '<div class="titlewrap"><h1 class="title">' + esc(a.name) + '</h1><div class="shimmer"></div></div></div>';
      dk += '<div class="slot" data-i="' + i + '" style="--t1:' + a.t1 + ';--t2:' + a.t2 + ';--glowA:' + a.glow + '66"><div class="reflect"></div><div class="tile"><span>' + esc(a.name) + '</span></div><div class="bar" style="box-shadow:0 0 16px ' + a.glow + '"></div></div>';
    });
    $('scenes').innerHTML = sc;
    $('heroes').innerHTML = he;
    $('dock').innerHTML = dk;
    $('avatar').textContent = (C.name || 'D').charAt(0).toUpperCase();
  }

  function resolveApps() {
    if (!A || !A.resolveApps) { APPS.forEach(function (a) { pkgs[a.id] = a.pakete && a.pakete[0]; }); return; }
    try { pkgs = JSON.parse(A.resolveApps(JSON.stringify(APPS.map(function (a) { return { id: a.id, pakete: a.pakete || [], namen: a.namen || [] }; })))) || {}; } catch (e) { pkgs = {}; }
  }

  // ---------- Uhr ----------
  var TAGE = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
  var MON = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function clock() {
    var d = new Date(), h = d.getHours();
    var g = h < 5 ? 'Gute Nacht' : h < 11 ? 'Guten Morgen' : h < 17 ? 'Hallo' : h < 22 ? 'Guten Abend' : 'Gute Nacht';
    var greet = g + ', ' + (C.name || 'Domi');
    var date = TAGE[d.getDay()] + ', ' + d.getDate() + '. ' + MON[d.getMonth()];
    var time = pad(h) + ':' + pad(d.getMinutes());
    $('greet').textContent = greet; $('date').textContent = date; $('time').textContent = time;
    $('igreet').textContent = greet; $('isub').textContent = time + ' · ' + date;
  }

  // ---------- Weiter ansehen ----------
  function ago(ts) {
    var m = Math.round((Date.now() - ts) / 60000);
    if (m < 1) return 'gerade eben';
    if (m < 60) return 'vor ' + m + ' Min.';
    var h = Math.round(m / 60);
    if (h < 24) return 'vor ' + h + ' Std.';
    var t = Math.round(h / 24);
    return t === 1 ? 'gestern' : 'vor ' + t + ' Tagen';
  }
  function appById(id) { for (var i = 0; i < APPS.length; i++) if (APPS[i].id === id) return APPS[i]; return null; }
  function buildCards() {
    cards = [];
    var manual = C.weiterAnsehen || [];
    if (manual.length) {
      manual.forEach(function (w) { var a = appById(w.app); if (a) cards.push({ app: a, title: w.titel, sub: w.info || '', right: '', link: w.link }); });
      $('contSub').textContent = 'Deine Serien und Filme';
    } else {
      store.get('recent', []).forEach(function (r) { var a = appById(r.id); if (a && pkgs[a.id]) cards.push({ app: a, title: a.name, sub: 'Zuletzt geöffnet', right: ago(r.ts) }); });
      $('contSub').textContent = 'Zuletzt geöffnet';
    }
    if (!cards.length) {
      cards.push({ hint: true, app: { name: 'Tipp', glow: '#8e8e93' }, title: 'Noch leer', sub: 'Öffne eine App, dann erscheint sie hier', right: '' });
    }
    var h = '';
    cards.forEach(function (c) {
      if (c.hint) {
        h += '<div class="card hint" style="--glowA:rgba(255,255,255,.15)"><div class="art"></div><div class="gloss"></div><div class="tag">Tipp</div>' +
          '<div class="txt"><div class="ct">' + esc(c.title) + '</div><div class="cs"><span>' + esc(c.sub) + '</span></div></div></div>';
        return;
      }
      var a = c.app;
      h += '<div class="card" style="--glowA:' + a.glow + '55"><div class="art" style="background:radial-gradient(circle at 78% 22%,' + a.glow + '99 0%,rgba(0,0,0,0) 60%),linear-gradient(155deg,' + a.t1 + ' 0%,' + a.t2 + ' 80%)"></div><div class="gloss"></div>' +
        '<div class="tag">' + esc(a.name) + '</div>' +
        '<div class="play"><svg width="26" height="26" viewBox="0 0 24 24" fill="#fff" style="margin-left:3px"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg></div>' +
        '<div class="txt"><div class="ct">' + esc(c.title) + '</div><div class="cs"><span>' + esc(c.sub) + '</span><span>' + esc(c.right) + '</span></div></div></div>';
    });
    $('cards').innerHTML = h;
    document.body.classList.toggle('nocont', cards.length === 0);
    if (S.cSel >= cards.length) S.cSel = 0;
  }

  // ---------- Darstellung ----------
  function each(sel, fn) { Array.prototype.forEach.call(document.querySelectorAll(sel), fn); }
  function render() {
    var z = S.zone, sel = S.sel;
    var sceneI = z === 'cont' && cards[S.cSel] && !cards[S.cSel].hint ? APPS.indexOf(cards[S.cSel].app) : sel;
    each('.scene', function (e, i) { e.classList.toggle('on', i === sceneI); });
    each('.hero', function (e, i) { e.classList.toggle('on', i === sel); e.classList.toggle('before', i < sel); });
    each('.slot', function (e, i) {
      var on = i === sel && z === 'apps';
      e.classList.toggle('on', on);
      e.firstChild.nextSibling.classList.toggle('on', on);
      e.firstChild.nextSibling.classList.toggle('missing', !pkgs[APPS[i].id]);
    });
    each('.card', function (e, i) { e.classList.toggle('on', z === 'cont' && i === S.cSel); });
    $('cards').style.transform = 'translateX(' + (-Math.max(0, S.cSel - 3) * 436) + 'px)';
    $('btnHome').classList.toggle('on', z === 'top' && S.tSel === 0);
    $('btnSettings').classList.toggle('on', z === 'top' && S.tSel === 1);
    document.body.classList.toggle('cont', z === 'cont');
    var beam = $('beam');
    if (z === 'apps') { beam.style.left = (96 + 28 + sel * 312 + 140 - 360) + 'px'; beam.style.opacity = 1; }
    else if (z === 'cont') { beam.style.left = (96 + Math.min(S.cSel, 3) * 436 + 200 - 360) + 'px'; beam.style.opacity = 1; }
    else beam.style.opacity = 0;
  }

  var tt = 0;
  function toast(msg) { var t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(function () { t.classList.remove('show'); }, 2600); }

  // ---------- Aktionen ----------
  function remember(id) {
    var r = store.get('recent', []).filter(function (x) { return x.id !== id; });
    r.unshift({ id: id, ts: Date.now() });
    store.set('recent', r.slice(0, 8));
  }
  function openApp(a) {
    var p = pkgs[a.id];
    if (!p) { toast(a.name + ' ist nicht installiert'); return; }
    var ok = A && A.launch ? A.launch(p) : false;
    if (!A) toast('Öffne ' + a.name);
    else if (!ok) { toast(a.name + ' lässt sich nicht öffnen'); return; }
    remember(a.id);
  }
  function openCard(c) {
    if (c.link && A && A.openUri) {
      if (A.openUri(c.link, pkgs[c.app.id] || '')) { remember(c.app.id); return; }
    }
    openApp(c.app);
  }

  function key(k) {
    if (introOn && k !== 'menu') { stopIntro(); return true; }
    var z = S.zone, n = APPS.length;
    if (z === 'apps') {
      if (k === 'left') S.sel = Math.max(0, S.sel - 1);
      else if (k === 'right') S.sel = Math.min(n - 1, S.sel + 1);
      else if (k === 'down') { if (cards.length) S.zone = 'cont'; }
      else if (k === 'up') { S.zone = 'top'; S.tSel = 0; }
      else if (k === 'ok') openApp(APPS[S.sel]);
      store.set('sel', S.sel);
    } else if (z === 'cont') {
      if (k === 'left') S.cSel = Math.max(0, S.cSel - 1);
      else if (k === 'right') S.cSel = Math.min(cards.length - 1, S.cSel + 1);
      else if (k === 'up' || k === 'back') S.zone = 'apps';
      else if (k === 'ok' && cards[S.cSel]) { if (cards[S.cSel].hint) toast('Öffne eine App, dann erscheint sie hier'); else openCard(cards[S.cSel]); }
    } else if (z === 'top') {
      if (k === 'left') S.tSel = 0;
      else if (k === 'right') S.tSel = 1;
      else if (k === 'down' || k === 'back') S.zone = 'apps';
      else if (k === 'ok') {
        if (S.tSel === 0) { if (A && A.openAmazonHome) A.openAmazonHome(); else toast('Fire-TV-Startseite'); }
        else { if (A && A.openSettings) A.openSettings(); else toast('Einstellungen'); }
        S.zone = 'apps';
      }
    }
    if (k === 'menu') { if (A && A.openSettings) A.openSettings(); }
    render();
    return true;
  }

  // ---------- Startanimation ----------
  var introOn = false, introT = 0;
  function playIntro() {
    if (C.intro === 'aus') return;
    var el = $('intro');
    el.classList.remove('play'); void el.offsetWidth; el.classList.add('play');
    introOn = true; clearTimeout(introT);
    introT = setTimeout(stopIntro, 3000);
  }
  function stopIntro() { introOn = false; clearTimeout(introT); $('intro').classList.remove('play'); }

  // ---------- Qualität ----------
  // auto: Auf schwachen Geräten (Fire TV Stick bis 1,5 GB RAM) immer leicht.
  function pickLite() {
    var q = C.qualitaet || 'auto';
    if (q === 'lite') return true;
    if (q === 'hoch') return false;
    if (A && A.deviceTier) { try { return A.deviceTier() !== 'high'; } catch (e) { return true; } }
    return false;
  }

  // ---------- Schnittstelle für die Android-App ----------
  window.tv = {
    key: key,
    onResume: function (awayMs) {
      clock(); buildCards(); S.zone = 'apps'; render();
      if (C.intro === 'immer' || (C.intro !== 'aus' && awayMs > 120000)) playIntro();
    },
  };

  // Tastatur (zum Testen am PC)
  var KEYS = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', Enter: 'ok', Escape: 'back', Backspace: 'back', ContextMenu: 'menu' };
  document.addEventListener('keydown', function (e) { if (A) return; var k = KEYS[e.key]; if (k) { e.preventDefault(); key(k); } });

  LITE = pickLite();
  document.body.classList.toggle('lite', LITE);
  build();
  resolveApps();
  clock();
  buildCards();
  render();
  setInterval(clock, 10000);
  if (C.intro !== 'aus') playIntro();
})();
</script>
